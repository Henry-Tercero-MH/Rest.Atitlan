# Entorno local completo: PostgreSQL + API + nginx (proxy inverso con soporte SSE).
# Uso: docker compose up --build   →  API en http://localhost:8080/api/health
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: menu
      POSTGRES_USER: menu
      POSTGRES_PASSWORD: menu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu -d menu"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://menu:menu@db:5432/menu
      PORT: 4000
      JWT_SECRET: solo-local-cambiar
      CORS_ORIGINS: http://localhost:8081,http://localhost:8080
      SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
